# Single entrypoint for every publish to the npm registry.
#
# npm trusted publishing binds each package to one repository + one workflow filename,
# and the registry allows only one trust config per package.
# Every release path therefore has to originate from THIS file -
# splitting stable and prerelease into separate workflows would break OIDC for all packages.
#
# Renaming this file invalidates every trust record and requires re-running
# `npm trust revoke` + `npm trust github` across the workspace.
#
# Only packages/* is published. The generators are private and ship as part
# of the packages that embed them, so they are built but never published.
#
# Versioning is manual and local. CI never bumps a version, never writes to
# the repository, and never consults a changelog tool -
# it publishes exactly what the tagged commit's manifests declare.
name: release

on:
  push:
    tags:
      - 'v*'

# Serialize releases against each other. The key is deliberately constant:
# on a tag push github.ref is the tag itself, so keying on it would put every
# release in its own group and serialize nothing.
# Never cancel in progress - a half-staged workspace is worse than a queued run.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:

  # Build in a separate job so the publish job never runs workspace code.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.15.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # slower, but without cache poisoning risk
          package-manager-cache: false

      - name: Install dependencies
        run: >-
          pnpm install
          --frozen-lockfile
          --ignore-scripts

      - name: Build packages
        run: >-
          pnpm
          --recursive
          run build

      # Tarballs are packed AND verified in the build job.
      # `workspace:` is a pnpm protocol and only pnpm rewrites it into a real range;
      # npm packs manifest verbatim, making every dependent package uninstallable.
      #
      # Packing with pnpm up front also means the publish job stages an already-built tarball,
      # and staging a tarball skips the packing pipeline entirely,
      # so no `.pnpmfile.mjs` hook can rewrite a manifest on the way out.
      #
      # `pnpm pack --recursive` is deliberately not used: it packs private packages too,
      # so every generator would land in the artifact and become a candidate for staging.
      # Iterating packages/* and skipping private manifests keeps the set identical to what the publish job expects.
      #
      # --pack-destination resolves relative to the package directory, so the
      # absolute workspace path is passed rather than a relative one.
      - name: Pack npm tarballs
        env:
          TARBALL_DIR: npm-tarballs
        run: |
          set -euo pipefail

          # an unmatched glob must expand to nothing, not to its own literal
          shopt -s nullglob

          mkdir -p "$TARBALL_DIR"

          packed=0

          for manifest in packages/*/package.json; do
            directory=$(dirname "$manifest")

            if [ "$(jq --raw-output '.private // false' "$manifest")" = "true" ]; then
              continue
            fi

            (
              cd "$directory"
              pnpm pack --pack-destination "${GITHUB_WORKSPACE}/${TARBALL_DIR}"
            )

            packed=$((packed + 1))
          done

          if [ "$packed" -eq 0 ]; then
            echo 'no publishable packages found under packages/' >&2
            exit 1
          fi

          echo "packed ${packed} tarball(s)"
          ls -1 "$TARBALL_DIR"

      # The one thing pnpm cannot check for itself - does packed version match the tag being released.
      # Everything else about the tarball is pnpm's own output,
      # and pnpm fails loudly on its own if packing goes wrong -
      # re-asserting it here would just be testing pnpm.
      #
      # Lockstep versioning across the workspace is assumed. Every offender is
      # reported rather than stopping at the first, so a botched bump shows the
      # full list in one run.
      - name: Verify tarball versions
        env:
          TARBALL_DIR: npm-tarballs
        run: |
          set -euo pipefail

          # an unmatched glob must expand to nothing, not to its own literal
          shopt -s nullglob

          tagged=${GITHUB_REF_NAME#v}
          mismatched=()

          for tarball in "$TARBALL_DIR"/*.tgz; do
            manifest=$(tar --extract --to-stdout --file "$tarball" package/package.json)

            name=$(printf '%s' "$manifest" | jq --raw-output '.name')
            version=$(printf '%s' "$manifest" | jq --raw-output '.version')

            if [ "$version" != "$tagged" ]; then
              mismatched+=("${name} declares ${version}")
            fi
          done

          if [ "${#mismatched[@]}" -gt 0 ]; then
            printf 'tag %s does not match:\n' "$tagged" >&2
            printf '  %s\n' "${mismatched[@]}" >&2
            exit 1
          fi

          echo "verified ${tagged} across every tarball"

      # Only the tarballs cross the job boundary - no manifests, no build directories, no workspace anchor.
      # The archive root is the tarball directory itself, so the download restores a flat set of .tgz files
      # into a path of the publish job's choosing.
      - name: Upload npm tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: npm-tarballs/*.tgz
          retention-days: 1

  # The critical job. Holds publish rights to the whole workspace and
  # therefore installs no dependencies and executes no lifecycle scripts.
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    needs:
      - build
    permissions:
      contents: read
      # mints the OIDC token that npm exchanges for short-lived publish
      # credentials - without this every publish fails with ENEEDAUTH
      id-token: write
    steps:
      # Deliberately no checkout. Everything this job needs is inside the tarballs.
      - name: Download npm tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: npm-tarballs

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # slower, but without cache poisoning risk
          package-manager-cache: false
          # not used for auth - no NPM_TOKEN is involved - but it writes the
          # registry into .npmrc so the CLI targets the right host
          registry-url: https://registry.npmjs.org

      # Stages every tarball the build job produced. Nothing here becomes installable:
      # a maintainer approves each staged version with 2FA afterwards,
      # via `npm stage approve <stage-id>` or the Staged Packages tab.
      #
      # There is deliberately no already-published check.
      # A release is not retried - a botched one is superseded by a new version -
      # so staging a version that is already live is a genuine error
      # and should fail the run rather than be skipped silently.
      - name: Stage npm packages
        run: |
          set -euo pipefail

          # an unmatched glob must expand to nothing, not to its own literal
          shopt -s nullglob

          tarballs=(npm-tarballs/*.tgz)

          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo 'no tarballs restored from the build job' >&2
            exit 1
          fi

          for tarball in "${tarballs[@]}"; do
            echo "stage $(basename "$tarball")"

            # `npm stage publish` takes a package spec, and a path to a tarball
            # is a valid spec - so the already-packed artifact is staged as is,
            # with no repacking and no manifest rewriting on the way out
            npm stage publish "$tarball" --ignore-scripts
          done

          echo "staged ${#tarballs[@]} package(s) - approve them with 2FA before they become installable"
