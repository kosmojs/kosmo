name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.18.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm -r install
      - run: pnpm -C test exec playwright install --with-deps chromium
      - run: pnpm -r build
      - run: pnpm test:unit
      - run: pnpm test:integration:cli
      - run: pnpm test:integration:backend
      - run: pnpm test:integration:frontend:csr
      - run: pnpm test:integration:frontend:ssr
      - run: pnpm test:integration:fetch:csr
      - run: pnpm test:integration:fetch:ssr
