name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.18.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm -r install
      - run: pnpm -C test exec playwright install --with-deps chromium
      - run: pnpm -r build

      - name: test:unit
        run: pnpm test:unit

      - name: test:integration cli
        run: pnpm test:integration cli

      - name: test:integration hono
        run: pnpm test:integration hono

      - name: test:integration koa
        run: pnpm test:integration koa

      - name: test:integration mdx
        run: pnpm test:integration mdx

      - name: test:integration react
        run: pnpm test:integration react

      - name: test:integration solid
        run: pnpm test:integration solid

      - name: test:integration svelte
        run: pnpm test:integration svelte

      - name: test:integration vue
        run: pnpm test:integration vue
