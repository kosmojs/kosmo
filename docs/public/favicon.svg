<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <style>
    /*
      A favicon has no page around it to inherit from, so currentColor would
      resolve to black and both schemes have to be settled here. Weights are
      the 16px cut: tabs render this at 16 to 20px, where a lighter stroke
      disappears.

      One class per role, never a shared one. CSS outranks presentation
      attributes, so a rule carrying `fill` would override the `fill="none"`
      on the two rings and collapse the mark into a solid disc.
    */
    .orbit,
    .sat {
      fill: none;
    }
    .orbit {
      stroke: #4c4f69;
    }
    .core {
      fill: #4c4f69;
    }
    .sat {
      stroke: #8839ef;
    }
    @media (prefers-color-scheme: dark) {
      .orbit {
        stroke: #cdd6f4;
      }
      .core {
        fill: #cdd6f4;
      }
      .sat {
        stroke: #cba6f7;
      }
    }
  </style>
  <mask id="m">
    <rect width="120" height="120" fill="#fff"></rect>
    <circle cx="92.9" cy="41" r="19" fill="#000"></circle>
  </mask>
  <circle class="orbit" cx="60" cy="60" r="38" stroke-width="8" mask="url(#m)"></circle>
  <circle class="core" cx="60" cy="60" r="14"></circle>
  <circle class="sat" cx="92.9" cy="41" r="13" stroke-width="6"></circle>
</svg>
